<!--THIS IS AN HTML PROGRAM ABOUT HOW TO ADD COLORS -->
<!DOCTYPE html>
<html>
    <head>
        <title>COLOR</title>
    </head>
    <body style="background-color: black;">
        <!--by the above the whole page will in black background-->
        <!--THIS IS ABOUT ONLY COLOR NOT BY ANY RGB CODE OR ANY OTHER CODE-->

        <h1 style="color: red;">RED</h1>
        <p style="color: red;">THIS IS A SAMPLE PARAGRAPH IN RED</p>
        <br>
        <!--this about how to add color by rgb code-->
        <!--I PICK RGB CODE FROM HEX COLOR PICKER-->
        <h1 style="color: rgb(3,70,255);">BLUE</h1>
        <p style="color: rgb(3,70,255);">THIS IS A SAMPLE PARAGRAPH IN BLUE</p>
        <br>
        <!--THIS IS ABOUT COLOR IN HEX CODE-->
        <h1 style="color: #de08ff;">PINK</h1>
        <p style="color: #de08ff;">THIS IS A SAMPLE PARAGRAPH IN PINK</p>
    </body>
</html>
