<!--THIS IS ABOUT AN IMPORTANT TAG THE META TAG-->
<!--THE META TAG IS AN OPEN TAG AND IT IS ONLY USED IN  HEAD TAG AND IT PROVIDES METADATA ABOUT AN DOCUMENT-->
<!--THE META DATA MEANS INFORMATION ABOUT THE DOCUMENT THAT IS NOT DISPLAYED ON THE PAGE-->   
<!DOCTYPE html>
<html>
    <head>
        <meta name="description" content="this is a webpage for meta tags ">
        <meta  name="keywords" content="html,meta tags">
        <meta name="author" content="KASI">
        <!--THIS AN META TAGS IN WHICH WE CAN SET SCALE OF AN MOBILE DEVICE-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!--THIS META TAG WE CAN SET IN HOW MANY SECONDS THE PAGE SHOULD REFRESH-->
        <meta http-equiv="refresh" content="2">
    </head>
    <body>

        
    </body>
</html>
